<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kel Playground</title>
<link rel="icon" type="image/svg+xml" href="/assets/kel-icon.svg">
<style>
  :root { --bg: #16161d; --panel: #1f1f29; --border: #34344a; --text: #e6e6f0; --muted: #9a9ab0; --accent: #ff7a59; --bad: #ff6b7a; }
  @media (prefers-color-scheme: light) { :root { --bg: #f6f6fa; --panel: #ffffff; --border: #d8d8e4; --text: #1d1d28; --muted: #62627a; --accent: #d9481f; --bad: #c42636; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, sans-serif; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 18px; }
  header span { color: var(--muted); font-size: 13px; }
  header select, header button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel); color: var(--text); }
  header button { margin-left: auto; background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; cursor: pointer; }
  main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); min-height: 0; }
  textarea, pre { margin: 0; padding: 16px; border: 0; background: var(--panel); color: var(--text); font: 14px/1.6 ui-monospace, SFMono-Regular, Consolas, monospace; tab-size: 4; }
  textarea { resize: none; outline: none; min-height: 60vh; }
  pre { overflow: auto; white-space: pre-wrap; }
  pre .error { color: var(--bad); }
  pre .meta { color: var(--muted); }
  @media (max-width: 720px) { main { grid-template-columns: 1fr; } textarea { min-height: 45vh; } }
</style>
</head>
<body>
<header>
  <img src="/assets/kel-icon.svg" width="28" height="28" alt=""><h1>Kel</h1><span>easy like Python · compiled to WebAssembly · runs in your browser</span>
  <select id="example" aria-label="Example"></select>
  <button id="run">Run ▶</button>
</header>
<main>
  <textarea id="code" spellcheck="false" aria-label="Kel code"></textarea>
  <pre id="output" aria-live="polite"></pre>
</main>
<script type="module">
  import { compile, run, formatError } from '/src/index.js';
  const examples = ['hello', 'fib', 'grades', 'primes'];
  const code = document.getElementById('code');
  const output = document.getElementById('output');
  const picker = document.getElementById('example');
  for (const name of examples) picker.add(new Option(`${name}.lus`, name));

  async function load(name) { code.value = await (await fetch(`/examples/${name}.lus`)).text(); }
  function line(text, className) { const span = document.createElement('span'); span.textContent = text + '\n'; if (className) span.className = className; output.append(span); }
  async function start() {
    output.textContent = '';
    try {
      const t0 = performance.now();
      const bytes = compile(code.value);
      const t1 = performance.now();
      await run(bytes, text => line(text));
      line(`\ncompiled in ${(t1 - t0).toFixed(1)} ms · ${bytes.length} bytes of WebAssembly · ran in ${(performance.now() - t1).toFixed(1)} ms`, 'meta');
    } catch (error) {
      line(formatError(error, code.value), 'error');
    }
  }
  code.addEventListener('keydown', (event) => {
    if (event.key === 'Tab') { event.preventDefault(); code.setRangeText('    ', code.selectionStart, code.selectionEnd, 'end'); }
    if (event.key === 'Enter' && (event.metaKey || event.ctrlKey)) start();
  });
  picker.addEventListener('change', () => load(picker.value));
  document.getElementById('run').addEventListener('click', start);
  await load('hello');
  start();
</script>
</body>
</html>
